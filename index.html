<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#052d4b">
<title>Restaurante del Parque – Pedidos</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css"></head><body>
<section id="v-login" class="view center" hidden>
  <img src="icons/logo.png" alt="Restaurante del Parque" class="logo">
  <h1>Pedido de provisiones</h1>
  <div class="card"><label>Usuario<input id="u" autocomplete="username" autocapitalize="none"></label>
  <label>Contraseña<input id="p" type="password" autocomplete="current-password"></label>
  <p id="err" class="err" role="alert"></p><button id="go" class="btn">Ingresar</button></div>
</section>
<section id="v-cats" class="view" hidden>
  <header class="bar"><div><b class="serif">Categorías</b><small id="who"></small></div><div><button id="gear" class="ghost" aria-label="Configuración de impresoras">⚙</button><button id="out" class="ghost">Salir</button></div></header>
  <div id="grid" class="grid"></div>
  <footer class="dock"><button class="btn send">ENVIAR PEDIDO <span class="cnt"></span></button></footer>
</section>
<section id="v-items" class="view" hidden>
  <header class="bar"><button id="back" class="ghost">‹ Categorías</button><b id="ct" class="serif"></b></header>
  <div id="list" class="list"></div>
  <footer class="dock"><button class="btn send">ENVIAR PEDIDO <span class="cnt"></span></button></footer>
</section>
<section id="v-prev" class="view" hidden>
  <header class="bar"><b class="serif">Revisá tu pedido</b></header>
  <div id="plist" class="plist"></div>
  <div class="pnote"><label for="note">Nota o comentario (opcional)</label><textarea id="note" maxlength="300" rows="3" placeholder="Ej.: entregar antes de las 10"></textarea></div>
  <div id="pchoose" class="pchoose"></div>
  <label class="chk mailrow"><input type="checkbox" id="mailchk"> Enviar por correo</label>
  <footer class="dock two"><button id="edit" class="btn alt">Editar</button><button id="acc" class="btn">Aceptar y enviar</button></footer>
</section>
<section id="v-done" class="view center" hidden>
  <img src="icons/logo.png" alt="" class="logo"><h1>¡Pedido enviado!</h1>
  <p id="dmsg" class="dmsg"></p><p id="dwarn" class="err"></p><p id="dprint" class="dmsg"></p><button id="rprint" class="btn alt" hidden>Reintentar impresión</button>
  <p id="dmail" class="dmsg"></p><button id="rmail" class="btn alt" hidden>Reintentar envío por mail</button>
  <div class="acts"><button id="dpdf" class="btn alt">Descargar PDF</button><button id="dimg" class="btn alt">Guardar imagen</button></div><button id="new" class="btn">Nuevo pedido</button>
</section>
<section id="v-cfg" class="view" hidden>
  <header class="bar"><button id="cfgb" class="ghost">‹ Volver</button><b class="serif">Impresoras</b></header>
  <div id="cfgl" class="list"></div>
</section>
<div id="toast" class="toast" role="status"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/docs.js"></script><script src="js/app.js"></script></body></html>
